<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Demos — Website Concepts</title><style>body{font-family:Inter,system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#0f172a}h1{color:#0e7490}a{color:#0e7490}.card{border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:12px 0}.badge{display:inline-block;background:#ecfeff;color:#0e7490;padding:4px 10px;border-radius:999px;font-size:12px}</style>
</head><body><h1>Hospital Website Demos</h1><p class="badge">Concept — Demo Only</p><p>Professional website concepts for hospitals — each demo is on its own branch and published to main.</p>
<div id="list"><p>Loading demos...</p></div>
<script>fetch('demos.json').then(r=>r.json()).then(d=>{let h='';d.forEach(x=>h+=`<div class=card><b>${x.name}</b> — ${x.city} <br><a href="${x.path}/">View Demo →</a> <span style="color:#64748b">${x.branch}</span></div>`);document.getElementById('list').innerHTML=h||'<p>No demos yet.</p>'}).catch(()=>document.getElementById('list').innerHTML='<p>No demos yet — first demos from Pune coming soon.</p>')</script>
</body></html>
